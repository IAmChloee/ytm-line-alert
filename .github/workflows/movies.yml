name: Movie radar

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send a test digest even if unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ytm-stock
  cancel-in-progress: false

jobs:
  movies:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check movies and send LINE
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: node movies.mjs

      - name: Save movie state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add movies-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update movie radar state [skip ci]'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
